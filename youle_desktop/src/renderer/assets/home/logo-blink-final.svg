  <defs>
    <mask id="c-loading" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse">
      <rect x="-100" y="-100" width="700" height="700" fill="black"/>
      <g class="c-rot">
        <circle class="c-dash" cx="210" cy="222" r="185"
                fill="none" stroke="white" stroke-width="110"
                stroke-linecap="round"/>
      </g>
    </mask>
  </defs>
  <style>
    .pupil-l { transform-origin: 145.72px 205.333px; animation: blink 5.5s linear infinite; }
    .pupil-l-inner { animation: saccade 8s ease-in-out infinite; }
    .lid-l { animation: lid 5.5s linear infinite; opacity: 0; }
    .arrow-r { transform-origin: 288px 198px; animation: blink 5.5s linear infinite; }
    .lid-r { animation: lid 5.5s linear infinite; opacity: 0; }
    .c-rot { transform-origin: 210px 222px; animation: c-rotate 3s linear infinite; }
    .c-dash { animation: c-dash 2.25s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    @keyframes blink {
      0%, 18% { transform: scaleY(1); }
      20% { transform: scaleY(0.04); }
      22%, 58% { transform: scaleY(1); }
      60% { transform: scaleY(0.04); }
      62% { transform: scaleY(1); }
      63% { transform: scaleY(0.04); }
      65%, 100% { transform: scaleY(1); }
    }
    @keyframes lid {
      0%, 18%, 22%, 58%, 62%, 65%, 100% { opacity: 0; }
      19%, 21%, 59%, 61%, 64% { opacity: 1; }
    }
    @keyframes saccade {
      0%, 8%, 100% { transform: translate(0, 0); }
      14%, 28% { transform: translate(7px, -2px); }
      36%, 48% { transform: translate(-5px, 3px); }
      56%, 90% { transform: translate(2px, 0); }
    }
    @keyframes c-rotate {
      to { transform: rotate(360deg); }
    }
    @keyframes c-dash {
      0% { stroke-dasharray: 1 1162; stroke-dashoffset: 0; }
      50% { stroke-dasharray: 1000 1162; stroke-dashoffset: -325; }
      100% { stroke-dasharray: 1000 1162; stroke-dashoffset: -1150; }
    }
  </style>

