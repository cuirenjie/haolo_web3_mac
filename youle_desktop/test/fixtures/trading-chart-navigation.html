<!doctype html><html data-theme="light"><head><meta charset="utf-8"><link rel="stylesheet" href="/styles.css"><style>html,body{margin:0;width:100%;height:100%}#host{width:1200px;height:800px}</style></head><body><div id="host"></div><script>window.addEventListener('error',e=>window.qaError=e.message);window.addEventListener('unhandledrejection',e=>window.qaError=String(e.reason));</script><script type="module">
const code = (await (await fetch('/trading-expert-market.ts')).text()).replaceAll('from "/','from "http://127.0.0.1:5183/');
const url = URL.createObjectURL(new Blob([code+'\nexport { TradingExpertMarketWorkspace };'], {type:'text/javascript'}));
const module = await import(url);
window.failHistory = false;
window.historyRequests = [];
window.codexDesktop = {
  getBinancePublicMarketData: async request => {
    if(request.path.endsWith('/klines')) {
      window.historyRequests.push(request.parameters.limit);
      if(window.failHistory) return {ok:false,status:500,error:'Injected gateway cache OOM'};
      const step = request.parameters.interval === '1d' ? 86400000 : 3600000;
      const end = Math.floor(Date.now()/step)*step;
      return {ok:true,status:200,data:Array.from({length:500},(_,i)=>{
        const time=end-(499-i)*step;const o=1300+Math.sin(i/9)*25+i/20;const c=o+Math.sin(i)*4;
        return [time,String(o),String(Math.max(o,c)+2),String(Math.min(o,c)-2),String(c),'100',time+step-1,'0',1,'0','0','0'];
      })};
    }
    if(request.path.endsWith('/exchangeInfo')) return {ok:true,status:200,data:{symbols:[]}};
    if(request.path.endsWith('/ticker/24hr')) return {ok:true,status:200,data:request.parameters.symbol?{lastPrice:'1330',openPrice:'1300',quoteVolume:'1'}:[]};
    return {ok:true,status:200,data:[]};
  },
  subscribeBinanceMarketStreams: async()=>({subscriptionId:'qa'}),
  unsubscribeBinanceMarketStreams: async()=>{},
  onBinanceMarketEvent: ()=>()=>{},
};
host.innerHTML = module.renderTradingExpertMarketWorkspace();
window.workspace = new module.TradingExpertMarketWorkspace(host, 'isolated-navigation-qa', 'isolated-navigation-qa');
window.initialRange = module.initialMarketLogicalRange;
await workspace.restartMarketData(); window.ready = true;
</script></body></html>
