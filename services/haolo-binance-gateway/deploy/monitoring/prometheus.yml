# Candidate configuration. Targets and secret files must be prepared from the
# actual active AND draining instances before use. Never scrape a load balancer.
global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/market-rules.yml
scrape_configs:
  - job_name: haolo-market
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/haolo-market-metrics-token
    file_sd_configs:
      - files: [/etc/prometheus/market-targets.json]
        refresh_interval: 15s
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'haolo_market_.*|haolo_gateway_.*|haolo_private_.*'
        action: keep
