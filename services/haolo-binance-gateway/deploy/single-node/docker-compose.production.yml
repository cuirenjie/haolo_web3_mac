name: haolo-binance

services:
  gateway:
    image: haolo/binance-gateway:20260822-auth1
    pull_policy: never
    env_file:
      - /opt/haolo/secrets/gateway-runtime.env
    ports:
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:8788:8788"
    depends_on:
      redis:
        condition: service_healthy
    init: true
    restart: unless-stopped
    # A release uses private cooperative drain, never Compose replacement.
    # This is a host-shutdown allowance, not permission to kill long sessions.
    stop_grace_period: 24h
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 512
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 768m
    cpus: 0.5
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
